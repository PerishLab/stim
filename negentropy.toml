[scan]
include = [
  "crates/**/*.rs",
  "docs/**/*.md",
]
exclude = [
  "**/target/**",
]

[module]
roots = [
  "crates/*/src",
  "crates/*/tests",
  "docs",
]

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 4

[comment]
allow = false

[word]
single = true

[[grant]]
syntax = "test"
paths = ["crates/*/tests/**/*.rs"]
