[workspace]
members = [
  "crates/cli",
  "crates/core",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://git.perish.top/PerishFire/stim"
version = "0.1.0"

[workspace.dependencies]
plumb-lib = { version = "0.2.0", registry = "perish" }
anyhow = "1.0.102"
axum = "0.8.8"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.5.60", features = ["derive", "env"] }
futures-util = "0.3.32"
hex = "0.4.3"
reqwest = { version = "0.13.2", features = ["json", "query", "stream"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
stim-core = { path = "crates/core" }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "1.0.7"
uuid = { version = "1.22.0", features = ["v4"] }
