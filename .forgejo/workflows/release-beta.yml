name: release-beta

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to release from
        required: true
        default: main
        type: string
      version_override:
        description: Release version, for example v0.1.0-beta.1
        required: false
        default: ""
        type: string

jobs:
  release:
    runs-on: docker
    container:
      image: mirror.perish.lan/ci/deno
    env:
      RELEASE_CHANNEL: beta
      RELEASE_VERSION: ${{ inputs.version_override }}
      STIM_RELEASES_PUBLIC_URL: ${{ vars.STIM_RELEASES_PUBLIC_URL }}
      STIM_RELEASES_S3_AK: ${{ secrets.STIM_RELEASES_S3_AK }}
      STIM_RELEASES_S3_BUCKET: ${{ secrets.STIM_RELEASES_S3_BUCKET }}
      STIM_RELEASES_S3_SK: ${{ secrets.STIM_RELEASES_S3_SK }}
      STIM_RELEASES_S3_URL: ${{ secrets.STIM_RELEASES_S3_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Install Ectropy
        uses: PerishLab/actions/setup-ectropy@main
        with:
          channel: beta
          version: v0.4.0-beta.1

      - name: Install Plumb
        uses: PerishLab/actions/setup-plumb@main
        with:
          channel: beta
          version: v0.16.0-beta.1

      - name: Guard
        run: |
          set -eu
          deno run --allow-read "--allow-write=." --allow-env --allow-net "--allow-run=git,cargo,ectropy,plumb,deno,tea,sh,runseal,rustc,node" --config .runseal/deno.json --lock .runseal/deno.lock --frozen=true .runseal/wrappers/guard.ts --fresh

      - name: Package
        run: |
          set -eu
          .forgejo/scripts/release/package.sh "$RELEASE_VERSION"
          echo "RELEASE_ROOT=$GITHUB_WORKSPACE/dist/$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Publish to R2
        run: .forgejo/scripts/release/publish.sh
