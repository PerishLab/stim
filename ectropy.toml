[[boundary]]
allow = ["path"]
note = "vite and vitest require root-level config files; path law anchors to src and tests"
paths = [
  "apps/web/vite.config.ts",
  "apps/web/vitest.config.ts",
]

[scan]
include = [
  "apps/**/*.css",
  "apps/**/*.scss",
  "apps/**/*.ts",
  "apps/**/*.tsx",
  "crates/**/*.rs",
  "docs/**/*.md",
]
exclude = [
  "**/dist/**",
  "**/node_modules/**",
  "**/target/**",
]

[module]
roots = [
  "apps/*/src",
  "apps/*/tests",
  "crates/*/src",
  "crates/*/tests",
  "docs",
]

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 4

[comment]
allow = false

[word]
single = true

[[grant]]
syntax = "test"
paths = [
  "apps/*/tests/**/*.test.ts",
  "apps/*/tests/**/*.test.tsx",
  "crates/*/tests/**/*.rs",
]

[[grant]]
syntax = "environment"
paths = [
  "apps/*/tests/**/*.test.ts",
  "apps/*/tests/**/*.test.tsx",
  "crates/cli/src/config.rs",
  "crates/cli/src/main.rs",
  "crates/*/tests/**/*.rs",
]

[vocabulary]
term = [
  { name = "VerifyingKey", description = "Ed25519 defines the public-key verification type." },
  { name = "maximum_ttl_seconds", description = "Reply capability policy exposes the lifetime in seconds." },
  { name = "reply_keys", description = "Reply capability rotation binds a set of trusted public keys." },
]
